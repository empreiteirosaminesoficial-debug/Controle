  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-emerald-700 selection:text-white">
    <div id="root">
      <!-- Splash Screen / Logo de Iniciação Oficial (visível no carregamento inicial antes do React) -->
      <div id="app-startup-splash" style="position:fixed;inset:0;background:linear-gradient(180deg,#134027 0%,#0f2c1b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:#ffffff;text-align:center;padding:24px;">
        <div style="position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
          <img src="/logo-transparent.png" alt="Empreiteiro Saminês" style="max-width:100%;max-height:100%;object-fit:contain;" onerror="this.src='/logo.png';" />
        </div>
        <h1 style="font-size:24px;font-weight:900;letter-spacing:-0.5px;margin:0 0 4px;color:#ffffff;">Empreiteiro Saminês</h1>
        <div style="display:inline-block;padding:3px 12px;border-radius:9999px;background:rgba(250,204,21,0.18);border:1px solid rgba(250,204,21,0.35);color:#fde047;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:24px;">
          Gestão de Obras & Serviços
        </div>
        <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.18);border-top-color:#22c55e;border-radius:50%;animation:splash-spin 0.8s linear infinite;"></div>
        <style>@keyframes splash-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
